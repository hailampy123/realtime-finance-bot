[project]
name = "finance-data-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "confluent-kafka>=2.5.0",
    "fastavro>=1.9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
# Not a default group: `uv sync`, `make check`, and the producer image's
# `uv sync --frozen --no-dev` all skip it. Opt in with `uv sync --group notebook`.
# Keeping jupyter and pandas out of the runtime image is the whole point.
notebook = [
    "jupyterlab>=4.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "nbstripout>=0.7",
]
# Not a default group: pyspark is ~300MB and only the lakehouse tests need it.
# The pipeline itself runs on Databricks Runtime, which supplies its own Spark,
# so this pin only has to agree with DBR closely enough for SQL semantics.
# Opt in with `uv sync --group lakehouse` or `make lakehouse-test`.
lakehouse = [
    "pyspark==3.5.3",
]
# Not a default group: boto3 is ~50MB and only the AWS-native workstream needs
# it. `make check` and the Kafka producer image never install it, which is what
# keeps `ingest/` free of an AWS dependency in practice as well as by convention.
# Opt in with `uv sync --group awsnative`.
awsnative = [
    "boto3>=1.35",
    "botocore>=1.35",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# devlab is dev-loop tooling, not runtime. It is listed so `import devlab`
# resolves from any working directory (Jupyter sets cwd to the notebook's own
# folder); docker/Dockerfile never COPYs it, so it stays out of the image.
include = ["ingest*", "backfill*", "devlab*", "lakehouse*", "awsnative*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff formats Python inside Markdown fences. docs/ holds design specs and
# implementation plans whose snippets are illustrative — some deliberately
# incomplete or invalid — so they are not lintable source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# The pipeline shells import `pyspark.pipelines` and use the `dbutils` global,
# both of which exist only on Databricks Runtime. mypy cannot see either, so
# checking these files locally reports errors about a runtime that is not here.
# The exemption is safe precisely because the shells hold no logic — everything
# worth checking lives in lakehouse.trades.*, which stays strictly checked, and
# tests/lakehouse/test_pipeline_contract.py asserts the shells stay logic-free.
[[tool.mypy.overrides]]
module = ["lakehouse.pipelines.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
