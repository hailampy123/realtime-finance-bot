services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: fdai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  producers:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fdai-producers
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      INGEST_BOOTSTRAP_SERVERS: kafka:9092
      INGEST_UNIVERSE_PATH: /app/config/universe.yaml
    profiles: ["live"]
    # No restart policy: a local producer that cannot reach its broker should
    # exit and say so. `unless-stopped` turned an unreachable-broker failure
    # into a container that error-looped for 16h and survived `compose-down`.
